<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="50%" stop-color="#101218" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Warm Champagne Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c56e" />
      <stop offset="50%" stop-color="#ffe19c" />
      <stop offset="100%" stop-color="#e5b450" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#0d0e13" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2230" />
      <stop offset="100%" stop-color="#12141c" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f5c56e" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#e5b450" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#spotlight)" />

  <!-- Subtle Architectural Grid Hairlines -->
  <line x1="80" y1="80" x2="1200" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <line x1="80" y1="560" x2="1200" y2="560" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <line x1="80" y1="80" x2="80" y2="560" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <line x1="1200" y1="80" x2="1200" y2="560" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Registration Marks -->
  <path d="M72,80 L88,80 M80,72 L80,88" stroke="#f5c56e" stroke-width="1.5" opacity="0.6" />
  <path d="M1192,80 L1208,80 M1200,72 L1200,88" stroke="#f5c56e" stroke-width="1.5" opacity="0.6" />
  <path d="M72,560 L88,560 M80,552 L80,568" stroke="#f5c56e" stroke-width="1.5" opacity="0.6" />
  <path d="M1192,560 L1208,560 M1200,552 L1200,568" stroke="#f5c56e" stroke-width="1.5" opacity="0.6" />

  <!-- Exhibition Top Header -->
  <text x="110" y="125" fill="#f5c56e" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" font-weight="600">
    GÖKTUĞ İŞERİ // WORKS EXHIBITION
  </text>
  <text x="1170" y="125" text-anchor="end" fill="#8e92a2" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">
    RETROSPECTIVE // 09 ARTIFACTS
  </text>

  <!-- Main Headline Typography -->
  <text x="110" y="195" fill="#ffffff" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Interactive Works Odyssey
  </text>
  <text x="110" y="235" fill="#a0a4b5" font-family="Georgia, serif" font-style="italic" font-size="20">
    Continuous Silky Lerp Scroll Physics • Optical Parallax • Live Interactive Sandboxes
  </text>

  <!-- Central Visual Cards Showcase (3D Layered Mockups) -->

  <!-- Left Card: SynapseFlow (Offset) -->
  <g transform="translate(140, 275) rotate(-3)" opacity="0.75" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="url(#cardGrad1)" stroke="rgba(192,132,252,0.4)" stroke-width="1.5" />
    <rect x="15" y="15" width="250" height="120" rx="12" fill="#1b152b" />
    <text x="25" y="115" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">02 // SYNAPSEFLOW</text>
    <text x="25" y="165" fill="#ffffff" font-family="'Syne', sans-serif" font-size="16" font-weight="700">Kahn DAG Engine</text>
    <text x="25" y="190" fill="#8e92a2" font-family="sans-serif" font-size="11">Visual Workflow Orchestrator</text>
  </g>

  <!-- Right Card: AuraCipher (Offset) -->
  <g transform="translate(860, 275) rotate(3)" opacity="0.75" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="url(#cardGrad1)" stroke="rgba(52,211,153,0.4)" stroke-width="1.5" />
    <rect x="15" y="15" width="250" height="120" rx="12" fill="#0f2119" />
    <text x="25" y="115" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">03 // AURACIPHER</text>
    <text x="25" y="165" fill="#ffffff" font-family="'Syne', sans-serif" font-size="16" font-weight="700">Zero-Knowledge Vault</text>
    <text x="25" y="190" fill="#8e92a2" font-family="sans-serif" font-size="11">AES-256-GCM &amp; LSB Steganography</text>
  </g>

  <!-- Center Hero Card: NeuroShield (Prominent & Glowing) -->
  <g transform="translate(450, 250)" filter="url(#shadow)">
    <rect width="380" height="270" rx="24" fill="url(#cardGrad2)" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Hero Card Image Mockup Frame -->
    <rect x="20" y="20" width="340" height="145" rx="16" fill="#0c1724" />
    
    <!-- Status Badges inside Hero Card -->
    <rect x="35" y="35" width="85" height="22" rx="6" fill="rgba(6,182,212,0.25)" stroke="rgba(6,182,212,0.6)" stroke-width="1" />
    <text x="45" y="50" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">01 // LLM01</text>
    
    <!-- Hero Card Title & Subtitle -->
    <text x="35" y="195" fill="#ffffff" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="22" font-weight="800">
      NeuroShield
    </text>
    <text x="35" y="220" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="13">
      "Enterprise Zero-Trust LLM Defense &amp; Guardrail"
    </text>
    
    <!-- Mini Metric Pills -->
    <rect x="35" y="235" width="95" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
    <text x="45" y="249" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">21/21 Tests</text>

    <rect x="140" y="235" width="105" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
    <text x="150" y="249" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Shannon H(X)</text>

    <rect x="255" y="235" width="85" height="20" rx="6" fill="rgba(245,197,110,0.2)" stroke="rgba(245,197,110,0.5)" stroke-width="1" />
    <text x="265" y="249" fill="#f5c56e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Full-Screen ↗</text>
  </g>

  <!-- Bottom Curator Footer -->
  <text x="110" y="540" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
    REACT 19 • TYPESCRIPT • TAILWIND CSS 4 • WEB AUDIO API
  </text>
  <text x="1170" y="540" text-anchor="end" fill="#f5c56e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    github.com/goktugis
  </text>
</svg>
